<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Oshi Archive</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#252529;background:#faf9f7}*{box-sizing:border-box}body{margin:0}header{padding:32px 5%;border-bottom:1px solid #ddd;background:white}h1{font-family:Georgia,serif;font-size:clamp(30px,6vw,52px);margin:0}header p{color:#777}main{max-width:1150px;margin:auto;padding:24px 4%}button,input,textarea{font:inherit}button{background:#252529;color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer}button.secondary{background:#eae8e5;color:#333}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}input,textarea{padding:12px;border:1px solid #ccc;border-radius:9px;width:100%;background:white}label{display:block;margin:12px 0 4px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}}.card{border:1px solid #e4e1dc;background:white;border-radius:13px;overflow:hidden;cursor:pointer}.photo{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}.placeholder{aspect-ratio:3/4;display:grid;place-items:center;color:#aaa;font-size:36px}.card section{padding:12px}.card h3{margin:0 0 5px;font-size:16px}.muted{color:#777;font-size:13px}.panel{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:18px 0}dialog{border:0;border-radius:16px;max-width:650px;width:94%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 15px 65px #0004}dialog::backdrop{background:#0008}.images{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.images img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:7px}.images img:first-child{outline:3px solid #333}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.rank{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #ddd}.rank img{height:85px;width:65px;object-fit:cover;border-radius:6px}.rank strong{font-size:24px}.empty{text-align:center;padding:60px 10px;color:#888}footer{padding:30px;text-align:center;color:#888;font-size:12px}a{color:#1760a0}.result-image{padding:0;background:#eee;overflow:hidden;border-radius:8px;aspect-ratio:3/4}.result-image img{width:100%;height:100%;object-fit:cover}.result-image img:first-child{outline:0}.top9grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:16px 0}.top9cell{aspect-ratio:1;background:#f0eeeb;border:1px solid #ddd;border-radius:5px;overflow:hidden;position:relative;padding:0;color:#999}.top9cell img{width:100%;height:100%;object-fit:cover}.top9cell span{position:absolute;bottom:0;left:0;right:0;background:#0009;color:white;padding:4px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:250px;overflow:auto}.choice{padding:5px;background:#f1f0ed;color:#222;font-size:12px;min-height:70px}.choice img{width:100%;height:65px;object-fit:cover}.choice.chosen{outline:3px solid #555}.choice:disabled{opacity:.4}.modalnav{display:flex;gap:6px;position:sticky;top:-22px;background:white;padding:12px 0;z-index:2}.modalnav button{font-size:13px;padding:9px 12px}dialog{padding-top:14px}</style></head><body><header><h1>My Oshi Archive</h1></header><main><div class="toolbar"><button onclick="edit()">＋ 推しを追加</button><button class="secondary" onclick="setMode('gallery')">ギャラリー</button><button class="secondary" onclick="setMode('timeline')">年表</button><button class="secondary" onclick="openTop9()">TOP9・共有</button><button class="secondary" onclick="backup()">バックアップ</button><button class="secondary" onclick="document.getElementById('import').click()">復元</button><input hidden type="file" id="import" accept=".json" onchange="restore(this)"></div><div class="panel" style="display:none"><b>画像を探して推しを登録</b><p class="muted">名前を入力してGoogle画像検索。気に入った画像を写真に保存したら「＋ 推しを追加」から選べます。</p><div class="actions"><input id="googleQuery" placeholder="キャラクター名・作品名" style="flex:1;min-width:160px"><button onclick="googleSearchFromTop()">Google画像検索 ↗</button><button class="secondary" onclick="edit()">写真から登録 ＋</button></div></div><label for="search">登録済みの推しを検索</label><input id="search" placeholder="登録済みの名前・作品名・メモで検索" oninput="render()"><p class="muted" id="count"></p><div id="content"></div></main><footer>My Favorite</footer><dialog id="top9dlg"><div class="modalnav"><button type="button" class="secondary" onclick="document.getElementById(\'top9dlg\').close()">← 一覧へ戻る</button></div><h2>MY TOP 9</h2><p class="muted">推しをタップして9人選択。選択順に並びます。</p><div id="top9grid" class="top9grid"></div><h3>登録済みの推し</h3><div id="top9choices" class="choices"></div><div class="actions"><button type="button" onclick="exportTop9()">画像を保存・共有</button><button type="button" class="secondary" onclick="top9Selection=[];drawTop9()">選び直す</button><button type="button" class="secondary" onclick="document.getElementById('top9dlg').close()">閉じる</button></div><p class="muted">画像は端末内で作成します。外部画像は配信元の制限で書き出せない場合があります。</p></dialog><dialog id="dlg"><div class="modalnav"><button type="button" class="secondary" onclick="closeEditor()">← 戻る</button><button type="button" class="secondary" onclick="closeEditor();setMode(\'timeline\')">年表</button><button type="button" class="secondary" onclick="closeEditor();openTop9()">TOP9</button></div><h2 id="dlgTitle">推しを登録</h2><form id="form" onsubmit="save(event)"><input type="hidden" id="id"><label>名前 *</label><input id="name" required placeholder="好きな名前を自由に入力"><label>作品名・所属（自由入力）</label><input id="work" placeholder="作品名"><label>好きになった年（任意）</label><input id="year" type="number" min="1900" max="2100" placeholder="2020"><label>スマホの写真・PCの画像から選択（複数選択可）</label><input type="file" id="files" accept="image/*" multiple onchange="addFiles(this)"><p class="muted">iPhoneでは「写真ライブラリ」を選んでください。複数の写真を選択できます。</p><label>画像URLを追加</label><div class="actions"><input id="imageurl" placeholder="https://..." style="flex:1;min-width:150px"><button type="button" class="secondary" onclick="addURL()">追加</button></div><label>サイト内で画像を検索</label><div class="actions"><input id="imageQuery" placeholder="キャラクター名・作品名" style="flex:1;min-width:150px"><button type="button" onclick="searchImages()">画像を検索</button></div><p class="muted" id="imageStatus">検索結果をタップして追加できます。検索元：Wikimedia Commons</p><div id="imageResults" class="images"></div><div id="previews" class="images"></div><p class="muted">画像をタップすると表紙に移動。×で削除できます。</p><label>好きな理由・思い出</label><textarea id="note" rows="5" placeholder="自由に書いてください"></textarea><div class="actions"><button type="submit">保存する</button><button type="button" class="secondary" onclick="closeEditor()">閉じる</button><button type="button" class="secondary" id="delete" onclick="removeItem()">削除</button></div></form></dialog><script>const key='oshi_archive_v4';let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]')}catch{}let mode='gallery',pics=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(key,JSON.stringify(items))}catch(e){alert('保存容量を超えました。画像を減らすかバックアップしてください。')}}function setMode(m){mode=m;render()}function photo(x){return x.images?.length?'<img class="photo" src="'+esc(x.images[0])+'" alt="">':'<div class="placeholder">♡</div>'}function render(){let q=$('search').value.toLowerCase();let a=items.filter(x=>[x.name,x.work,x.note].join(' ').toLowerCase().includes(q));$('count').textContent=a.length+' 件の推し';if(!a.length){$('content').innerHTML='<div class="empty">該当する登録はありません。<br>上の「写真から登録」から追加できます。</div>';return}if(mode==='timeline')a.sort((x,y)=>(x.year||9999)-(y.year||9999));if(mode==='ranking')a.sort((x,y)=>(x.rank||9999)-(y.rank||9999));$('content').innerHTML=mode==='ranking'?'<div class="panel"><h2>MY FAVORITES — ランキング</h2><p class="muted">上下ボタンで順位を入れ替えられます。</p>'+a.map((x,i)=>'<div class="rank"><strong>#'+(i+1)+'</strong>'+(x.images?.[0]?'<img src="'+esc(x.images[0])+'">':'♡')+'<div style="flex:1"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.work)+'</div></div><button class="secondary" onclick="move(\''+x.id+'\',-1)">↑</button><button class="secondary" onclick="move(\''+x.id+'\',1)">↓</button><button onclick="edit(\''+x.id+'\')">編集</button></div>').join('')+'</div>':'<div class="grid">'+a.map(x=>'<article class="card" onclick="edit(\''+x.id+'\')">'+photo(x)+'<section><h3>'+esc(x.name)+'</h3><div class="muted">'+esc(x.work)+(x.year?' · '+esc(x.year)+'年':'')+'</div>'+(mode==='timeline'&&x.note?'<p>'+esc(x.note).slice(0,100)+'</p>':'')+'</section></article>').join('')+'</div>'}function closeEditor(){$('dlg').close()}function edit(id){let x=items.find(x=>x.id===id);$('form').reset();$('id').value=x?.id||'';$('name').value=x?.name||'';$('work').value=x?.work||'';$('year').value=x?.year||'';$('note').value=x?.note||'';pics=[...(x?.images||[])];$('delete').style.display=x?'':'none';$('dlgTitle').textContent=x?'推しを編集':'推しを登録';showPics();$('imageQuery').value=x?.name||'';$('imageResults').innerHTML='';$('imageStatus').textContent='検索結果をタップして追加できます。検索元：Wikimedia Commons';$('dlg').showModal()}function showPics(){$('previews').innerHTML=pics.map((p,i)=>'<div><img src="'+esc(p)+'" onclick="promote('+i+')" title="表紙にする"><button type="button" class="secondary" onclick="pics.splice('+i+',1);showPics()">×</button></div>').join('')}function promote(i){pics.unshift(pics.splice(i,1)[0]);showPics()}function addURL(){let v=$('imageurl').value.trim();if(!/^https?:\/\//i.test(v))return alert('https:// で始まる画像URLを入力してください');pics.push(v);$('imageurl').value='';showPics()}function addFiles(input){let fs=[...input.files];Promise.all(fs.map(f=>new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)}))).then(a=>{pics.push(...a);showPics();input.value=''})}function googleSearchFromTop(){let q=$('googleQuery').value.trim();if(!q)return alert('検索する名前を入力してください');window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q),'_blank')}async function searchImages(){let q=$('imageQuery').value.trim()||$('name').value.trim();if(!q)return alert('検索する名前を入力してください');$('imageStatus').textContent='検索中…';$('imageResults').innerHTML='';try{let u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=6&gsrlimit=30&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=260&format=json&origin=*';let res=await fetch(u);if(!res.ok)throw Error();let data=await res.json();let pages=Object.values(data.query?.pages||{}).filter(p=>p.imageinfo?.[0]?.mime?.startsWith('image/')&&p.imageinfo?.[0]?.url);window.imageHits=pages.map(p=>({thumb:p.imageinfo[0].thumburl||p.imageinfo[0].url,url:p.imageinfo[0].url,title:p.title}));$('imageStatus').textContent=pages.length?pages.length+'件見つかりました。タップして追加できます。':'見つかりませんでした。別の名前で試してください。';$('imageResults').innerHTML=window.imageHits.map((p,i)=>'<button type="button" class="result-image" onclick="pickImage('+i+')"><img loading="lazy" src="'+esc(p.thumb)+'" alt="'+esc(p.title)+'"></button>').join('')}catch(e){$('imageStatus').textContent='検索に失敗しました。再試行してください。'}}function pickImage(i){let p=window.imageHits?.[i];if(!p)return;if(!pics.includes(p.url))pics.push(p.url);showPics();$('imageStatus').textContent='画像を追加しました。続けて選べます。'}function save(e){e.preventDefault();let id=$('id').value||String(Date.now()),old=items.find(x=>x.id===id);let x={id,name:$('name').value.trim(),work:$('work').value.trim(),year:$('year').value,note:$('note').value,images:pics,rank:old?.rank||items.length+1};if(!x.name)return;items=items.filter(x=>x.id!==id);items.push(x);persist();$('dlg').close();render()}function removeItem(){if(!confirm('この推しを削除しますか？'))return;items=items.filter(x=>x.id!==$('id').value);persist();$('dlg').close();render()}function move(id,d){let sorted=[...items].sort((a,b)=>(a.rank||9999)-(b.rank||9999));let i=sorted.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=sorted.length)return;[sorted[i],sorted[j]]=[sorted[j],sorted[i]];sorted.forEach((x,k)=>x.rank=k+1);items=sorted;persist();render()}let top9Selection=[];try{top9Selection=JSON.parse(localStorage.getItem('oshi_top9')||'[]')}catch{}function openTop9(){top9Selection=top9Selection.filter(id=>items.some(x=>x.id===id)).slice(0,9);drawTop9();document.getElementById('top9dlg').showModal()}function toggleTop9(id){let i=top9Selection.indexOf(id);if(i>=0)top9Selection.splice(i,1);else if(top9Selection.length<9)top9Selection.push(id);drawTop9()}function drawTop9(){localStorage.setItem('oshi_top9',JSON.stringify(top9Selection));$('top9grid').innerHTML=Array.from({length:9},(_,i)=>{let x=items.find(x=>x.id===top9Selection[i]);return '<button type="button" class="top9cell" onclick="removeTop9('+i+')">'+(x?.images?.[0]?'<img src="'+esc(x.images[0])+'">':x?'♡':i+1)+(x?'<span>'+esc(x.name)+'</span>':'')+'</button>'}).join('');$('top9choices').innerHTML=items.map(x=>'<button type="button" class="choice '+(top9Selection.includes(x.id)?'chosen':'')+'" onclick="toggleTop9(\''+x.id+'\')" '+(top9Selection.length>=9&&!top9Selection.includes(x.id)?'disabled':'')+'>'+(x.images?.[0]?'<img src="'+esc(x.images[0])+'">':'♡')+'<div>'+esc(x.name)+'</div></button>').join('')}function removeTop9(i){if(top9Selection[i]){top9Selection.splice(i,1);drawTop9()}}function loadCanvasImage(url){return new Promise(resolve=>{if(!url)return resolve(null);let im=new Image();im.crossOrigin='anonymous';im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src=url})}async function exportTop9(){if(!top9Selection.length)return alert('推しを選択してください');let c=document.createElement('canvas');c.width=1200;c.height=1350;let g=c.getContext('2d');g.fillStyle='#faf9f7';g.fillRect(0,0,1200,1350);g.fillStyle='#252529';g.font='bold 54px Georgia,serif';g.textAlign='center';g.fillText('MY TOP 9',600,80);let selected=top9Selection.map(id=>items.find(x=>x.id===id));let images=await Promise.all(selected.map(x=>loadCanvasImage(x?.images?.[0])));for(let i=0;i<9;i++){let x=selected[i],im=images[i],col=i%3,row=Math.floor(i/3),px=40+col*375,py=120+row*390,w=365,h=350;g.fillStyle='#eae8e5';g.fillRect(px,py,w,h);if(im){let scale=Math.max(w/im.width,(h-45)/im.height),sw=w/scale,sh=(h-45)/scale;g.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,px,py,w,h-45)}g.fillStyle='#252529';g.fillRect(px,py+h-45,w,45);g.fillStyle='white';g.font='22px system-ui';g.textAlign='center';let name=x?.name||'';while(g.measureText(name).width>w-16&&name.length>1)name=name.slice(0,-2)+'…';g.fillText(name,px+w/2,py+h-14)}g.fillStyle='#888';g.font='19px system-ui';g.fillText('MY FAVORITE',600,1320);try{let blob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error()),'image/png'));let file=new File([blob],'my-top9.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'MY TOP 9'});return}let url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='my-top9.png';link.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(e){if(e.name==='AbortError')return;alert('画像の書き出しに失敗しました。外部画像を端末の写真から登録し直すと改善する場合があります。')}}function backup(){let blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='oshi-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(input){let f=input.files[0];if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d))throw Error();if(!confirm('現在のデータをバックアップの内容で置き換えますか？'))return;items=d;persist();render()}).catch(()=>alert('JSONを読み込めませんでした'))}render();</script></body></html>
