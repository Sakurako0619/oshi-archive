<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Oshi Archive</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#252529;background:#faf9f7}*{box-sizing:border-box}body{margin:0}header{padding:32px 5%;border-bottom:1px solid #ddd;background:white}h1{font-family:Georgia,serif;font-size:clamp(30px,6vw,52px);margin:0}header p{color:#777}main{max-width:1150px;margin:auto;padding:24px 4%}button,input,textarea{font:inherit}button{background:#252529;color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer}button.secondary{background:#eae8e5;color:#333}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}input,textarea{padding:12px;border:1px solid #ccc;border-radius:9px;width:100%;background:white}label{display:block;margin:12px 0 4px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}}.card{border:1px solid #e4e1dc;background:white;border-radius:13px;overflow:hidden;cursor:pointer}.photo{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}.placeholder{aspect-ratio:3/4;display:grid;place-items:center;color:#aaa;font-size:36px}.card section{padding:12px}.card h3{margin:0 0 5px;font-size:16px}.muted{color:#777;font-size:13px}.panel{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:18px 0}dialog{border:0;border-radius:16px;max-width:650px;width:94%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 15px 65px #0004}dialog::backdrop{background:#0008}.images{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.images img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:7px}.images img:first-child{outline:3px solid #333}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.rank{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #ddd}.rank img{height:85px;width:65px;object-fit:cover;border-radius:6px}.rank strong{font-size:24px}.empty{text-align:center;padding:60px 10px;color:#888}footer{padding:30px;text-align:center;color:#888;font-size:12px}a{color:#1760a0}</style></head><body><header><h1>My Oshi Archive</h1><p>好きだった人たちと、その頃の自分の記録。</p></header><main><div class="toolbar"><button onclick="edit()">＋ 推しを追加</button><button class="secondary" onclick="setMode('gallery')">ギャラリー</button><button class="secondary" onclick="setMode('timeline')">年表</button><button class="secondary" onclick="setMode('ranking')">ランキング</button><button class="secondary" onclick="backup()">バックアップ</button><button class="secondary" onclick="document.getElementById('import').click()">復元</button><input hidden type="file" id="import" accept=".json" onchange="restore(this)"></div><input id="search" placeholder="名前・作品名・文章で検索" oninput="render()"><p class="muted" id="count"></p><div id="content"></div></main><footer>My Oshi Archive · 個人用アーカイブ</footer><dialog id="dlg"><h2 id="dlgTitle">推しを登録</h2><form id="form" onsubmit="save(event)"><input type="hidden" id="id"><label>名前 *</label><input id="name" required placeholder="好きな名前を自由に入力"><label>作品名・所属（自由入力）</label><input id="work" placeholder="作品名"><label>好きになった年（任意）</label><input id="year" type="number" min="1900" max="2100" placeholder="2020"><label>画像を追加（複数選択可）</label><input type="file" id="files" accept="image/*" multiple onchange="addFiles(this)"><label>画像URLを追加</label><div class="actions"><input id="imageurl" placeholder="https://..." style="flex:1;min-width:150px"><button type="button" class="secondary" onclick="addURL()">追加</button></div><p class="muted">画像検索は別タブで行い、使用可能な画像を保存・アップロードしてください。</p><button type="button" class="secondary" onclick="searchImages()">名前で画像を検索 ↗</button><div id="previews" class="images"></div><p class="muted">画像をタップすると表紙に移動。×で削除できます。</p><label>好きな理由・思い出</label><textarea id="note" rows="5" placeholder="自由に書いてください"></textarea><div class="actions"><button type="submit">保存する</button><button type="button" class="secondary" onclick="dlg.close()">閉じる</button><button type="button" class="secondary" id="delete" onclick="removeItem()">削除</button></div></form></dialog><script>const key='oshi_archive_v4';let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]')}catch{}let mode='gallery',pics=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(key,JSON.stringify(items))}catch(e){alert('保存容量を超えました。画像を減らすかバックアップしてください。')}}function setMode(m){mode=m;render()}function photo(x){return x.images?.length?'<img class="photo" src="'+esc(x.images[0])+'" alt="">':'<div class="placeholder">♡</div>'}function render(){let q=$('search').value.toLowerCase();let a=items.filter(x=>[x.name,x.work,x.note].join(' ').toLowerCase().includes(q));$('count').textContent=a.length+' 件の推し';if(!a.length){$('content').innerHTML='<div class="empty">まだ登録がありません。<br>「＋ 推しを追加」から始めてください。</div>';return}if(mode==='timeline')a.sort((x,y)=>(x.year||9999)-(y.year||9999));if(mode==='ranking')a.sort((x,y)=>(x.rank||9999)-(y.rank||9999));$('content').innerHTML=mode==='ranking'?'<div class="panel"><h2>MY FAVORITES — ランキング</h2><p class="muted">上下ボタンで順位を入れ替えられます。</p>'+a.map((x,i)=>'<div class="rank"><strong>#'+(i+1)+'</strong>'+(x.images?.[0]?'<img src="'+esc(x.images[0])+'">':'♡')+'<div style="flex:1"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.work)+'</div></div><button class="secondary" onclick="move(\''+x.id+'\',-1)">↑</button><button class="secondary" onclick="move(\''+x.id+'\',1)">↓</button><button onclick="edit(\''+x.id+'\')">編集</button></div>').join('')+'</div>':'<div class="grid">'+a.map(x=>'<article class="card" onclick="edit(\''+x.id+'\')">'+photo(x)+'<section><h3>'+esc(x.name)+'</h3><div class="muted">'+esc(x.work)+(x.year?' · '+esc(x.year)+'年':'')+'</div>'+(mode==='timeline'&&x.note?'<p>'+esc(x.note).slice(0,100)+'</p>':'')+'</section></article>').join('')+'</div>'}function edit(id){let x=items.find(x=>x.id===id);$('form').reset();$('id').value=x?.id||'';$('name').value=x?.name||'';$('work').value=x?.work||'';$('year').value=x?.year||'';$('note').value=x?.note||'';pics=[...(x?.images||[])];$('delete').style.display=x?'':'none';$('dlgTitle').textContent=x?'推しを編集':'推しを登録';showPics();$('dlg').showModal()}function showPics(){$('previews').innerHTML=pics.map((p,i)=>'<div><img src="'+esc(p)+'" onclick="promote('+i+')" title="表紙にする"><button type="button" class="secondary" onclick="pics.splice('+i+',1);showPics()">×</button></div>').join('')}function promote(i){pics.unshift(pics.splice(i,1)[0]);showPics()}function addURL(){let v=$('imageurl').value.trim();if(!/^https?:\/\//i.test(v))return alert('https:// で始まる画像URLを入力してください');pics.push(v);$('imageurl').value='';showPics()}function addFiles(input){let fs=[...input.files];Promise.all(fs.map(f=>new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)}))).then(a=>{pics.push(...a);showPics();input.value=''})}function searchImages(){let q=$('name').value.trim();if(!q)return alert('先に名前を入力してください');window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q),'_blank')}function save(e){e.preventDefault();let id=$('id').value||String(Date.now()),old=items.find(x=>x.id===id);let x={id,name:$('name').value.trim(),work:$('work').value.trim(),year:$('year').value,note:$('note').value,images:pics,rank:old?.rank||items.length+1};if(!x.name)return;items=items.filter(x=>x.id!==id);items.push(x);persist();$('dlg').close();render()}function removeItem(){if(!confirm('この推しを削除しますか？'))return;items=items.filter(x=>x.id!==$('id').value);persist();$('dlg').close();render()}function move(id,d){let sorted=[...items].sort((a,b)=>(a.rank||9999)-(b.rank||9999));let i=sorted.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=sorted.length)return;[sorted[i],sorted[j]]=[sorted[j],sorted[i]];sorted.forEach((x,k)=>x.rank=k+1);items=sorted;persist();render()}function backup(){let blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='oshi-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(input){let f=input.files[0];if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d))throw Error();if(!confirm('現在のデータをバックアップの内容で置き換えますか？'))return;items=d;persist();render()}).catch(()=>alert('JSONを読み込めませんでした'))}render();</script></body></html>
